  <rect class="m" x="23.5" y="5" width="3.5" height="22" rx="1.5"/>
  <rect class="m" x="8.5" y="7" width="15" height="4" rx="1.5"/>
  <path class="m" d="M9 16 L16 22 L23 16 L23 19.5 L16 25.5 L9 19.5 Z"/>
</svg>
